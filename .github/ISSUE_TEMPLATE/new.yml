name: Missing internship
description: Suggest a mechanical engineering or related hardware internship.
title: "[Listing] "
body:
  - type: markdown
    attributes:
      value: Include public job information only. We track internships and co-ops, not software-only or full-time roles.
  - type: input
    id: company
    attributes:
      label: Company
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Job title
      placeholder: Mechanical Engineering Intern - Summer 2027
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Direct employer job-description URL
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
    validations:
      required: true
  - type: input
    id: term
    attributes:
      label: Internship term
      description: Enter the term stated by the employer, or Unknown. Do not infer it from the posting date.
    validations:
      required: true
