name: Broken link or closed listing
description: Report an expired posting, incorrect detail, or broken link.
title: "[Correction] "
body:
  - type: input
    id: url
    attributes:
      label: Listed job URL
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: Problem
      options:
        - Closed or expired
        - Broken or generic link
        - Incorrect title, term, or location
        - Role outside scope
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and suggested correction
      description: Include public source links and when you checked. Do not include application statuses or personal details.
    validations:
      required: true
