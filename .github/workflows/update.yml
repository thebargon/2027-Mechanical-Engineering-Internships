name: Update Mechanical Engineering Internships

permissions:
  contents: write

concurrency:
  group: update-me-internships
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: scripts

      - name: Generate internship list
        run: bun run generate
        working-directory: scripts

      - name: Commit changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --staged --quiet; then
            echo "No internship changes found."
            exit 0
          fi

          git commit -m "chore: update mechanical engineering internships"

      - name: Push changes
        run: git push origin HEAD:main