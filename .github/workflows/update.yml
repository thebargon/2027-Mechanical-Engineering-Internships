name: Update Mechanical Engineering Internships

permissions:
  contents: write

concurrency:
  group: update-me-internships
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        working-directory: scripts

      - name: Generate internship list
        run: bun run generate
        working-directory: scripts

      - name: Commit changes
        if: success()
        run: |
          git config --local user.name "${{ github.actor }}"
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "chore: update mechanical engineering internships"

      - name: Push changes
        if: success()
        run: |
          git fetch origin
          git pull origin main --no-rebase || git checkout --theirs README.md
          # Regenerate to resolve any conflicts
          cd scripts
          bun run generate
          cd ..
          git add .
          git commit -m "chore: update mechanical engineering internships" || true
          git push origin main
